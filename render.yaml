services:
  - type: web
    name: salary-predictor
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: >-
      pip install -r requirements.txt
      && cd backend/ml && python train.py && cd ../..
      && cd frontend && npm install && npm run build && cd ..
    startCommand: cd backend && gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://salary-predictor-1ta9.onrender.com"
      - key: PREDICT_RATE_LIMIT
        value: "30 per minute"
